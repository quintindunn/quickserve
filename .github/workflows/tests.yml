name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: |
          python - <<'PY'
          import unittest

          excluded = {
              "test_get_jre_linux",
              "test_get_jre_windows",
              "test_get_jre_darwin",
              "test_jre",
          }

          def without_platform_install_tests(suite):
              filtered = unittest.TestSuite()
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      filtered.addTests(without_platform_install_tests(test))
                  elif test._testMethodName not in excluded:
                      filtered.addTest(test)
              return filtered

          suite = unittest.defaultTestLoader.discover(
              "src/tests", pattern="test_*.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(
              without_platform_install_tests(suite)
          )
          raise SystemExit(not result.wasSuccessful())
          PY
