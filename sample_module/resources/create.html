{% extends "core/module.html" %}
{% block modulehead %}
    <link rel="stylesheet" href="{{ resource(filename='create.css') }}">
{% endblock %}
{% block modulebody %}
    <div class="create">
        <h2 class="create-heading">Minecraft Vanilla Server Generator</h2>
        <form action="{{ action("install") }}"
              method="post"
              id="install-form"
              class="qs-form">
            <label>
                Instance Name
                <input type="text" name="instance-name" value="MinecraftVanilla" required>
            </label>
            <label for="only-releases">
                <input type="checkbox" id="only-releases" name="only-releases" checked>
                Only Show Releases
            </label>
            <label>
                Version
                <select name="minecraft-version" id="minecraft-version">
                    <option value="latest-release">Latest Release</option>
                    <option value="latest-snapshot">Latest Snapshot</option>
                    {% for version in context.param_versions %}
                        <option value="{{ version.id }}"
                                data-is-release="{{ version.is_release | lower }}">{{ version.id }}</option>
                    {% endfor %}
                </select>
                <p class="omni-archive-credit">Minecraft Server versions ≤ 1.2.4 supplied by <a href="https://omniarchive.net/"
    class="unstyled-anchor omni-archive-link">OmniArchive</a></p>
            </label>
            <label for="eula">
                <input type="checkbox" id="eula" name="eula" required>
                I agree to the<a href="https://www.minecraft.net/en-us/eula"
   target="_blank"
   rel="noopener noreferrer">Minecraft EULA.</a>
            </label>
            <button type="submit">Install</button>
        </form>
    </div>
    <script>
        const checkbox = document.getElementById("only-releases");
        const select = document.getElementById("minecraft-version");
        const form = document.getElementById("install-form");
        const eula = document.getElementById("eula");

        function updateVersions() {
            for (const option of select.options) {
                if (option.dataset.isRelease !== undefined) {
                    option.hidden = checkbox.checked &&
                        option.dataset.isRelease !== "true";
                }
            }
        }

        checkbox.addEventListener("change", updateVersions);
        updateVersions();

        form.addEventListener("submit", function(event) {
            if (!eula.checked) {
                event.preventDefault();
                alert("You must agree to the Minecraft EULA before installing.");
            }
        });
    </script>
{% endblock %}
