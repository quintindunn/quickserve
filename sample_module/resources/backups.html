{% extends "core/module.html" %}
{% block modulebody %}
    <div class="backup-controls">
        <form class="qs-form"
              action="{{ action("backup-instance") }}"
              method="post">
            <label>
                Backup Now<button type="submit" id="backupNow" name="backupNow">Backup Now</button>
            </label>
            <label>
                <input type="hidden"
                       id="instance-uuid"
                       name="instance-uuid"
                       value="{{ context.instance_uuid }}">
            </label>
        </form>
    </div>
    <div>{{ simple_filesystem(root=context.param_backup_dir, sort_by="date_created_descending") }}</div>
{% endblock %}
