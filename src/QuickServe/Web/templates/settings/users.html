{% extends "core/core.html" %}
{% block title %}User Management{% endblock title %}
{% block head %}
    <link rel="stylesheet"
          href="{{ url_for('static', filename="core/user-management.css") }}">
{% endblock head %}
{% block content %}
    {% include "common/popup.html" %}
    <div class="user-management">
        <div class="hero">
            <h1>User Management</h1>
        </div>
        <div class="user-table">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in context.users %}
                        <tr>
                            <td>{{ user.username }}</td>
                            <td>
                                <button onclick='setPopup("Change Password", [minButton("Cancel", () => {}), submitButton("Change", () => {})])'
                                        class="change-password">Change Password</button>
                                <button onclick='setPopup("Delete User", [minButton("Cancel", () => {}), deleteButton("Delete", () => {})])'
                                        class="delete-user">Delete</button>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function onChangePassword(btn, username) {
            console.log(username);
        }

        function onDeleteUser(btn, username) {
            console.log(username);
        }
    </script>
{% endblock content %}
