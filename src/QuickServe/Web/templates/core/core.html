<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}QuickServe{% endblock %}</title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='core/core.css') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='core/forms.css') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='core/search.css') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='core/modules.css') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='core/sidebar.css') }}">
        <script src="{{ url_for('static', filename='core/search.js') }}" defer></script>
        {% block head %}{% endblock %}
    </head>
    <body>
        <input type="hidden"
               id="search-endpoint"
               value="{{ url_for("api.search") }}">
        <div class="search-bar">
            <input placeholder="Search for Modules and Instances"
                   type="text"
                   id="search-bar"
                   class="search-bar">
            <div class="search-results" id="search-results"></div>
        </div>
        <a class="logo" href="{{ url_for("home.index") }}">
            <img class="quickserve-logo"
                 src="{{ url_for('static', filename="core/QuickServe.webp") }}"
                 alt="QuickServe logo featuring a Q with a server rack inside and four horizontal lines extending from the left.">
        </a>
        <div class="main">
            <div class="sidebar">
                <div class="sidebar-section">
                    <span>INSTANCES</span>
                    <div class="sidebar-subsection">
                        {% for instance in instances %}
                            <span>
                                <a href="{{ instance.url }}">{{ instance.name }}</a>
                            </span>
                        {% endfor %}
                    </div>
                </div>
                <div class="sidebar-section">
                    <span>MODULES</span>
                    {% for module in modules %}
                        <div class="sidebar-subsection">
                            <span>
                                <a href="{{ url_for('modules.module_about', module_name=module) }}">{{ module }}</a>
                            </span>
                        </div>
                    {% endfor %}
                </div>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </body>
</html>
